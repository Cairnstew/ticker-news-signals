name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: lint + typecheck + offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install (editable, dev extras)
        run: pip install -e ".[dev]"
      - name: ruff (lint + format check)
        run: |
          ruff check ticker_news_signals/ cli.py tests/ examples/ tools/
          ruff format --check ticker_news_signals/ cli.py tests/ examples/ tools/
      - name: pyright (typecheck)
        run: pyright ticker_news_signals
      - name: notebook builds (offline)
        run: |
          python tools/build_notebook.py
          python -c "import nbformat; nbformat.read('notebooks/pipeline.ipynb', as_version=4)"
      - name: offline test suite
        # Every test mock: the `live`/`integration` markers exist for manual runs
        # against the real feeds and are not part of CI.
        run: python -m pytest -q

  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build
        run: |
          pip install build
          python -m build
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error